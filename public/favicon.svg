<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- White dot (indicator like in the navbar logo) -->
  <circle cx="440" cy="72" r="36" fill="#ffffff" stroke="#16a34a" stroke-width="12"/>
  <!-- "VD" text -->
  <text x="256" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="260" fill="#ffffff" text-anchor="middle" letter-spacing="-8">VD</text>
</svg>
